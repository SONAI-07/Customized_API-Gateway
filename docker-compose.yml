version: '3.8'

services:
  # 1. Your Custom API Gateway
  api-gateway:
    build: .
    container_name: hyper-reactive-gateway
    ports:
      - "8080:8080"
    environment:
      # Hackathon users can override secrets easily here!
      - GATEWAY_AUTH_SECRET=my-super-secret-hackathon-key-1234567890
      - GATEWAY_REGISTRY_TOKEN=hackathon-registry-token
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - gateway-net

  # 2. Prometheus (Scrapes your /actuator/prometheus endpoint)
  prometheus:
    image: prom/prometheus:latest
    container_name: gateway-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - gateway-net

  # 3. Grafana (Visualizes the Prometheus data)
  grafana:
    image: grafana/grafana:latest
    container_name: gateway-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge